<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>مدرستي المباشرة — منصة التعليم المغربي</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Inter:wght@400;500;600;700;800&display=swap">

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>

  <a class="skip-link" href="#view">تخطى إلى المحتوى الرئيسي</a>
  <div id="app"></div>

  <!-- ── DIAGNOSTIC: shows every error on screen ── -->
  <div id="md-error" style="display:none;position:fixed;inset:0;z-index:99999;
       background:#0e1836;color:#fff;padding:2rem;font-family:monospace;
       overflow:auto;direction:ltr;text-align:left">
    <h2 style="color:#ffab24;margin-bottom:1rem">⚠️ خطأ في تحميل الموقع</h2>
    <pre id="md-error-body" style="white-space:pre-wrap;font-size:14px;line-height:1.6"></pre>
  </div>
  <script>
    (function () {
      var shown = false;
      function show(msg) {
        if (shown) return; shown = true;
        var box = document.getElementById('md-error');
        var body = document.getElementById('md-error-body');
        if (!box || !body) return;
        body.textContent += msg + '\n\n';
        box.style.display = 'block';
      }
      window.addEventListener('error', function (e) {
        show('❌ ' + (e.message || 'Unknown error')
          + '\n   at ' + (e.filename || '?') + ':' + (e.lineno || '?')
          + (e.error && e.error.stack ? '\n\n' + e.error.stack : ''));
      });
      window.addEventListener('unhandledrejection', function (e) {
        show('❌ Unhandled promise rejection:\n'
          + (e.reason && e.reason.message ? e.reason.message : String(e.reason))
          + (e.reason && e.reason.stack ? '\n\n' + e.reason.stack : ''));
      });
      // After 2s, check whether the app actually rendered anything
      setTimeout(function () {
        var app = document.getElementById('app');
        if (!app || app.innerHTML.trim() === '') {
          show('❌ The app rendered nothing.\n'
            + '   window.MD = ' + (window.MD ? 'exists' : 'MISSING') + '\n'
            + '   window.MD.state    = ' + (window.MD && window.MD.state ? 'ok' : 'MISSING') + '\n'
            + '   window.MD.i18n     = ' + (window.MD && window.MD.i18n ? 'ok' : 'MISSING') + '\n'
            + '   window.MD.data     = ' + (window.MD && window.MD.data ? 'ok' : 'MISSING') + '\n'
            + '   window.MD.search   = ' + (window.MD && window.MD.search ? 'ok' : 'MISSING') + '\n'
            + '   window.MD.router   = ' + (window.MD && window.MD.router ? 'ok' : 'MISSING') + '\n'
            + '   window.MD.components = ' + (window.MD && window.MD.components ? 'ok' : 'MISSING') + '\n'
            + '   window.MD.pages    = ' + (window.MD && window.MD.pages ? 'ok' : 'MISSING') + '\n'
            + '   location.hash = ' + location.hash);
        }
      }, 2000);
    })();
  </script>

  <!-- ── App scripts, in strict order ── -->
  <script src="js/state.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/search.js"></script>
  <script src="js/router.js"></script>
  <script src="js/components.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/main.js"></script>

  <script>if (!location.hash) location.hash = '#/';</script>

</body>
</html>
